<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>といの途中</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap');

  :root {
    --bg: #0a0a0a;
    --text: #e8e4df;
    --text-dim: #8a8580;
    --text-faint: #4a4540;
    --accent: #c4a882;
    --input-bg: #151413;
    --input-border: #2a2725;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Maru Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  #app {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    position: relative;
  }

  .entrance {
    text-align: center;
    animation: fadeIn 2s ease;
  }

  .entrance h1 {
    font-weight: 400;
    font-size: 1.05rem;
    letter-spacing: 0.25em;
    margin-bottom: 2rem;
    color: var(--text-dim);
  }

  .entrance p {
    font-weight: 300;
    font-size: 0.85rem;
    color: var(--text-faint);
    line-height: 2;
    margin-bottom: 3rem;
  }

  .start-btn {
    background: none;
    border: 1px solid var(--text-faint);
    color: var(--text-dim);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 300;
    font-size: 0.85rem;
    padding: 0.8rem 2.5rem;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: all 0.8s ease;
    border-radius: 24px;
  }

  .start-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .question-container {
    width: 100%;
    max-width: 480px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
  }

  .stage-indicator {
    font-weight: 300;
    font-size: 0.7rem;
    color: var(--text-faint);
    letter-spacing: 0.3em;
    margin-bottom: 3rem;
  }

  .question-text {
    font-weight: 300;
    font-size: 1.25rem;
    line-height: 2.2;
    letter-spacing: 0.05em;
    color: var(--text);
    margin-bottom: 3rem;
    min-height: 4em;
  }

  .question-text .line {
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 1.2s ease, transform 1.2s ease;
    display: block;
  }

  .question-text .line.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .input-area {
    width: 100%;
    opacity: 0;
    transform: translateY(10px);
    transition: all 1.2s ease;
  }

  .input-area.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .input-area textarea {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 300;
    font-size: 0.95rem;
    line-height: 1.8;
    padding: 1rem 1.2rem;
    resize: none;
    outline: none;
    border-radius: 8px;
    min-height: 80px;
    transition: border-color 0.5s ease;
  }

  .input-area textarea::placeholder {
    color: var(--text-faint);
    font-weight: 300;
  }

  .input-area textarea:focus {
    border-color: var(--accent);
  }

  .next-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 300;
    font-size: 0.8rem;
    cursor: pointer;
    margin-top: 1.5rem;
    letter-spacing: 0.15em;
    padding: 0.5rem 1rem;
    opacity: 0;
    transition: all 0.8s ease;
  }

  .next-btn.visible {
    opacity: 1;
  }

  .next-btn:hover {
    color: var(--accent);
  }

  .next-btn:disabled {
    cursor: default;
    opacity: 0;
  }

  .closing {
    text-align: center;
    max-width: 480px;
  }

  .closing .line {
    font-weight: 300;
    font-size: 1.1rem;
    line-height: 2.2;
    letter-spacing: 0.05em;
    color: var(--text);
    display: block;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }

  .closing .line.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .feedback-section {
    margin-top: 3rem;
    width: 100%;
    max-width: 480px;
    opacity: 0;
    transform: translateY(10px);
    transition: all 1.5s ease;
  }

  .feedback-section.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .feedback-divider {
    width: 24px;
    height: 1px;
    background: var(--text-faint);
    margin: 0 auto 2rem;
  }

  .feedback-label {
    font-weight: 300;
    font-size: 0.85rem;
    color: var(--text-dim);
    line-height: 2;
    margin-bottom: 1.2rem;
    text-align: center;
  }

  .feedback-notice {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 300;
    font-size: 0.72rem;
    color: var(--text-faint);
    line-height: 1.8;
    margin-bottom: 1.2rem;
    text-align: center;
  }

  .feedback-textarea {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 300;
    font-size: 0.9rem;
    line-height: 1.8;
    padding: 1rem 1.2rem;
    resize: none;
    outline: none;
    border-radius: 8px;
    min-height: 70px;
    transition: border-color 0.5s ease;
  }

  .feedback-textarea::placeholder {
    color: var(--text-faint);
    font-weight: 300;
  }

  .feedback-textarea:focus {
    border-color: var(--accent);
  }

  .feedback-actions {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 1.2rem;
  }

  .feedback-btn {
    background: none;
    border: none;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 300;
    font-size: 0.8rem;
    cursor: pointer;
    letter-spacing: 0.1em;
    padding: 0.6rem 1.2rem;
    transition: all 0.5s ease;
  }

  .feedback-btn.submit {
    color: var(--accent);
    border: 1px solid var(--input-border);
    border-radius: 20px;
  }

  .feedback-btn.submit:hover {
    border-color: var(--accent);
  }

  .feedback-btn.submit:disabled {
    color: var(--text-faint);
    cursor: default;
    border-color: var(--input-border);
  }

  .feedback-btn.skip {
    color: var(--text-faint);
  }

  .feedback-btn.skip:hover {
    color: var(--text-dim);
  }

  .feedback-thanks {
    font-weight: 300;
    font-size: 0.85rem;
    color: var(--text-dim);
    text-align: center;
    margin-top: 1rem;
    opacity: 0;
    transition: opacity 1s ease;
  }

  .feedback-thanks.visible {
    opacity: 1;
  }

  .progress {
    position: fixed;
    bottom: 2rem;
    display: flex;
    gap: 0.8rem;
  }

  .progress .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text-faint);
    transition: all 0.8s ease;
  }

  .progress .dot.active {
    background: var(--accent);
    box-shadow: 0 0 6px rgba(196, 168, 130, 0.3);
  }

  .progress .dot.done {
    background: var(--text-dim);
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  .fade-out {
    animation: fadeOut 1s ease forwards;
  }

  textarea::-webkit-scrollbar { display: none; }
  textarea { -ms-overflow-style: none; scrollbar-width: none; }

  .hidden-iframe { display: none; }

  #app::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
  }
</style>
</head>
<body>

<iframe name="hidden_iframe" class="hidden-iframe"></iframe>

<div id="app"></div>

<script>
const GOOGLE_FORM_ACTION = 'https://docs.google.com/forms/d/e/1FAIpQLSc-43iTY67ZFrr3WGzOUCZNFut0TWNLJNbzg3VHnKHXe9jIpw/formResponse';
const GOOGLE_FORM_ENTRY  = 'entry.1435516015';

const QUESTIONS = [
  {
    stage: "1 / 3",
    lines: [
      "最近、あなたが",
      "いちばん時間を使っていることは",
      "なんですか。"
    ],
    placeholder: "思い浮かぶままに…",
    lineDelay: 1500
  },
  {
    stage: "2 / 3",
    lines: [
      "それは、",
      "あなたが本当に大切にしたいことと",
      "つながっていますか。"
    ],
    placeholder: "",
    lineDelay: 1800
  },
  {
    stage: "3 / 3",
    lines: [
      "もし誰にも評価されなくても、",
      "それでも考え続けたい「問い」が",
      "あるとしたら、",
      "それはどんな問いですか。"
    ],
    placeholder: "",
    lineDelay: 1800
  }
];

const CLOSING_QUESTION = {
  stage: "ふりかえり",
  lines: [
    "ここまでの時間を過ごして、",
    "今、どんな感覚がありますか。",
    "",
    "一言だけ、残してみてください。"
  ],
  placeholder: "",
  lineDelay: 1600
};

const CLOSING_LINES = [
  "ありがとうございます。",
  "",
  "あなたの問いは、",
  "まだ途中にあっていい。",
  "",
  "答えを急がなくていい。"
];

let currentStep = -1;
const app = document.getElementById('app');

function render() {
  if (currentStep === -1) renderEntrance();
  else if (currentStep < QUESTIONS.length) renderQuestion(QUESTIONS[currentStep], currentStep);
  else if (currentStep === QUESTIONS.length) renderQuestion(CLOSING_QUESTION, currentStep);
  else renderClosing();
}

function renderEntrance() {
  app.innerHTML = `
    <div class="entrance">
      <h1>といの途中</h1>
      <p>
        少しだけ立ち止まって、<br>
        自分自身に問いかける時間。<br><br>
        3つの問いと、ひとつの振り返り。<br>
        5分ほどの静かな対話です。
      </p>
      <button class="start-btn" onclick="startJourney()">はじめる</button>
    </div>
  `;
}

function startJourney() {
  const entrance = app.querySelector('.entrance');
  entrance.classList.add('fade-out');
  setTimeout(() => {
    currentStep = 0;
    render();
  }, 1000);
}

function renderQuestion(q, index) {
  const totalSteps = QUESTIONS.length + 1;

  let dotsHtml = '';
  for (let i = 0; i < totalSteps; i++) {
    const cls = i < index ? 'done' : i === index ? 'active' : '';
    dotsHtml += `<div class="dot ${cls}"></div>`;
  }

  const linesHtml = q.lines.map(line =>
    line === ''
      ? '<span class="line" style="height:0.8em;">&nbsp;</span>'
      : `<span class="line">${line}</span>`
  ).join('');

  app.innerHTML = `
    <div class="question-container">
      <div class="stage-indicator">${q.stage}</div>
      <div class="question-text">${linesHtml}</div>
      <div class="input-area" id="inputArea">
        <textarea id="responseInput" rows="3" placeholder="${q.placeholder}"></textarea>
        <button class="next-btn" id="nextBtn" onclick="nextStep()" disabled>
          ${currentStep < QUESTIONS.length ? 'つぎへ' : 'おわる'}
        </button>
      </div>
    </div>
    <div class="progress">${dotsHtml}</div>
  `;

  const lineEls = app.querySelectorAll('.question-text .line');
  const delay = q.lineDelay || 1800;

  lineEls.forEach((el, i) => {
    setTimeout(() => {
      el.classList.add('visible');
      if (i === lineEls.length - 1) {
        setTimeout(() => {
          document.getElementById('inputArea').classList.add('visible');
          setTimeout(() => {
            const input = document.getElementById('responseInput');
            if (input) input.focus();
          }, 500);
        }, 1200);
      }
    }, 600 + i * delay);
  });

  setTimeout(() => {
    const input = document.getElementById('responseInput');
    const btn = document.getElementById('nextBtn');
    if (input && btn) {
      input.addEventListener('input', () => {
        const hasText = input.value.trim().length > 0;
        btn.disabled = !hasText;
        if (hasText) btn.classList.add('visible');
        else btn.classList.remove('visible');
      });
    }
  }, 100);
}

function nextStep() {
  const input = document.getElementById('responseInput');
  if (!input || !input.value.trim()) return;

  const container = app.querySelector('.question-container');
  if (container) container.classList.add('fade-out');

  setTimeout(() => {
    currentStep++;
    render();
  }, 1000);
}

function renderClosing() {
  const linesHtml = CLOSING_LINES.map(line =>
    line === ''
      ? '<span class="line" style="height:0.8em;">&nbsp;</span>'
      : `<span class="line">${line}</span>`
  ).join('');

  app.innerHTML = `
    <div class="closing">
      ${linesHtml}

      <div class="feedback-section" id="feedbackSection">
        <div class="feedback-divider"></div>
        <div class="feedback-label" id="feedbackLabel">
          よければ、この体験への感想を<br>聞かせてください。
        </div>
        <div class="feedback-notice" id="feedbackNotice">
          ※ 入力内容は送信されます。<br>個人が特定される情報は含めないでください。<br>ここまでの問いへの回答は記録されていません。
        </div>
        <textarea class="feedback-textarea" id="feedbackInput" rows="3" placeholder="感じたこと、思ったこと…"></textarea>
        <div class="feedback-actions" id="feedbackActions">
          <button class="feedback-btn skip" onclick="closeFeedback()">送信せずに終わる</button>
          <button class="feedback-btn submit" id="submitBtn" onclick="submitFeedback()" disabled>送信する</button>
        </div>
        <div class="feedback-thanks" id="feedbackThanks">
          ありがとうございました。
        </div>
      </div>
    </div>
    <div class="progress">
      <div class="dot done"></div>
      <div class="dot done"></div>
      <div class="dot done"></div>
      <div class="dot done"></div>
    </div>
  `;

  const lineEls = app.querySelectorAll('.closing .line');
  lineEls.forEach((el, i) => {
    setTimeout(() => {
      el.classList.add('visible');
    }, 800 + i * 1500);
  });

  const feedbackDelay = 800 + CLOSING_LINES.length * 1500 + 2000;
  setTimeout(() => {
    const fs = document.getElementById('feedbackSection');
    if (fs) fs.classList.add('visible');
  }, feedbackDelay);

  setTimeout(() => {
    const input = document.getElementById('feedbackInput');
    const btn = document.getElementById('submitBtn');
    if (input && btn) {
      input.addEventListener('input', () => {
        btn.disabled = !input.value.trim();
      });
    }
  }, feedbackDelay);
}

function submitFeedback() {
  const input = document.getElementById('feedbackInput');
  if (!input || !input.value.trim()) return;

  const feedback = input.value.trim();

  const form = document.createElement('form');
  form.method = 'POST';
  form.action = GOOGLE_FORM_ACTION;
  form.target = 'hidden_iframe';

  const field = document.createElement('input');
  field.type = 'hidden';
  field.name = GOOGLE_FORM_ENTRY;
  field.value = feedback;
  form.appendChild(field);

  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);

  document.getElementById('feedbackInput').style.display = 'none';
  document.getElementById('feedbackActions').style.display = 'none';
  document.getElementById('feedbackNotice').style.display = 'none';
  document.getElementById('feedbackLabel').style.display = 'none';

  const thanks = document.getElementById('feedbackThanks');
  if (thanks) thanks.classList.add('visible');
}

function closeFeedback() {
  const section = document.getElementById('feedbackSection');
  if (section) {
    section.style.opacity = '0';
    section.style.transform = 'translateY(10px)';
  }
}

render();
</script>
</body>
</html>
